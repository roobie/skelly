<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gungen viewer</title>
    <link rel="stylesheet" href="./src/viewer/style.css" />
  </head>
  <body>
    <aside id="panel">
      <h1>gungen viewer</h1>
      <label class="field">
        Assembly
        <select id="fixture"></select>
      </label>
      <label class="field file">
        Open a JSON file…
        <input id="file" type="file" accept=".json,application/json" />
      </label>
      <fieldset id="generate">
        <legend>Generate</legend>
        <label class="field">
          Template
          <select id="template"></select>
        </label>
        <div class="row">
          <button id="prev-seed" type="button" title="Previous seed">◀</button>
          <label class="seed">Seed <input id="seed" type="number" step="1" value="0" /></label>
          <button id="next-seed" type="button" title="Next seed">▶</button>
        </div>
        <label><input id="only-valid" type="checkbox" /> Skip to the next valid seed</label>
        <div class="row">
          <button id="generate-btn" type="button">Generate</button>
        </div>
      </fieldset>
      <fieldset id="design-tools">
        <legend>Design</legend>
        <label class="field">
          Status
          <select id="design-status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </label>
        <button id="save" type="button">Save design JSON</button>
        <p id="save-message" aria-live="polite"></p>
      </fieldset>
      <section id="design-info" aria-live="polite"></section>
      <fieldset id="cycle-controls" hidden>
        <legend>Action cycle <span class="estimated">estimated</span></legend>
        <label class="field">Cycle <select id="cycle-mode"><option value="fire">Gas-driven fire</option><option value="hand">Hand cocking</option></select></label>
        <div class="row">
          <button id="cycle-play" type="button">Play</button>
          <label class="field">Speed <select id="cycle-speed"></select></label>
        </div>
        <input id="cycle-scrub" class="cycle-scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Cycle time" />
        <label id="cycle-empty-label"><input id="cycle-empty" type="checkbox" /> Magazine empty (AR bolt catch)</label>
        <label><input id="cycle-xray" type="checkbox" /> Fade receiver to see carrier</label>
        <p id="cycle-readout" aria-live="polite"></p>
        <p id="cycle-notes"></p>
      </fieldset>
      <p id="description"></p>
      <div id="status"></div>
      <ol id="issues"></ol>
      <fieldset>
        <legend>Colours</legend>
        <label><input id="role-colors" type="checkbox" /> Colour by role (geometry check)</label>
      </fieldset>
      <fieldset id="layers">
        <legend>Show</legend>
        <label><input type="checkbox" data-layer="solids" checked /> Solids</label>
        <label><input type="checkbox" data-layer="ports" checked /> Ports</label>
        <label><input type="checkbox" data-layer="keepOuts" checked /> Keep-out volumes</label>
        <label><input type="checkbox" data-layer="axes" checked /> Main axis</label>
      </fieldset>
      <p class="hint">
        Drag to orbit, scroll to zoom. Click an issue to isolate it.
        Ports: <span class="k normal">normal</span> <span class="k up">up</span>.
      </p>
      <p id="hover"></p>
    </aside>
    <main id="view">
      <section id="param-panel" aria-label="Parameters"></section>
    </main>
    <script type="module" src="./src/viewer/main.ts"></script>

    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>

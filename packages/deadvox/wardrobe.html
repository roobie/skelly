<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadvox wardrobe spike</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #b8c4c8; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #labels { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-around; pointer-events: none; }
      #labels span { padding: 3px 7px; background: #172128d8; color: #f2f0e8; border-radius: 3px; font-size: 13px; }
      #stats { position: absolute; top: 8px; left: 10px; padding: 5px 8px; background: #f2f0e8e0; border-radius: 3px; font-size: 12px; white-space: pre; }
      #pickers { position: absolute; top: 8px; right: 10px; display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; background: #f2f0e8e0; border-radius: 3px; font-size: 12px; max-height: calc(100% - 60px); overflow-y: auto; }
      #pickers label { display: flex; justify-content: space-between; gap: 8px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="stats"></div>
    <div id="pickers"></div>
    <script type="module" src="./src/debug/wardrobe.ts"></script>
  </body>
</html>

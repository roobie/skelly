[package]
name = "deadvox-rapier-f64"
version = "0.1.0"
edition = "2018"
license = "Apache-2.0"

[features]
default = ["dim3"]
dim3 = []

[lib]
name = "rapier_wasm3d"
crate-type = ["cdylib"]

[dependencies]
rapier3d = { package = "rapier3d-f64", version = "=0.30.1", features = ["serde-serialize", "debug-render", "profiler", "enhanced-determinism"] }
parry3d = { package = "parry3d-f64", version = "=0.25.3" }
ref-cast = "=1.0.25"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
nalgebra = "=0.34.1"
serde = { version = "=1.0.219", features = ["derive", "rc"] }
bincode = "=1.3.3"
palette = "=0.7.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dim2"))'] }

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "s"

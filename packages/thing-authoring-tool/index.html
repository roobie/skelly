<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thing authoring</title>
    <style>
      body { margin: 0; color: #e4e9ee; background: #20252b; font-family: system-ui, sans-serif; }
      header { padding: 0.8rem 1rem; display: flex; align-items: center; gap: 1rem; }
      h1 { font-size: 1rem; margin: 0; }
      canvas { display: block; width: 100vw; height: calc(100vh - 4rem); }
      #error { color: #ffb3a8; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>Thing authoring</h1>
      <label>Item <select id="item"></select></label>
      <span>Drag to orbit and change elevation. Right-drag to pan. Scroll to zoom.</span>
    </header>
    <pre id="error" hidden></pre>
    <canvas id="view" aria-label="Assembly preview"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

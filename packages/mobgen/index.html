<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mobgen viewer</title>
    <link rel="stylesheet" href="./src/viewer/style.css" />
  </head>
  <body>
    <aside id="panel">
      <h1>mobgen viewer: leaper</h1>
      <fieldset id="generate">
        <legend>Generate</legend>
        <div class="row">
          <button id="prev-seed" type="button" title="Previous seed">◀</button>
          <label class="seed">Seed <input id="seed" type="number" step="1" value="0" /></label>
          <button id="next-seed" type="button" title="Next seed">▶</button>
        </div>
        <label class="field">
          Voxel size
          <select id="voxel-size">
            <option value="template">Template default (full profile)</option>
            <option value="far">1/2 of a block (far LOD, silhouette profile)</option>
          </select>
        </label>
      </fieldset>
      <fieldset id="pose">
        <legend>Pose</legend>
        <label class="field">
          Stance
          <select id="stance">
            <option value="coiled">Coiled (rest)</option>
            <option value="reared">Reared</option>
          </select>
        </label>
        <div class="row">
          <button type="button" data-view="front">Front</button>
          <button type="button" data-view="side">Side</button>
          <button type="button" data-view="three-quarter">3/4</button>
        </div>
      </fieldset>
      <p id="description"></p>
      <div id="status"></div>
      <ol id="issues"></ol>
      <div id="stats"></div>
      <fieldset id="layers">
        <legend>Show</legend>
        <label><input type="checkbox" data-layer="flesh" checked /> Flesh</label>
        <label><input type="checkbox" data-layer="skeleton" /> Skeleton</label>
        <label><input type="checkbox" data-layer="colorByBone" /> Colour by bone</label>
        <label><input type="checkbox" data-layer="scale" checked /> 2 m post (for scale)</label>
      </fieldset>
      <p class="hint">Drag to orbit, scroll to zoom.</p>
    </aside>
    <main id="view"></main>
    <script type="module" src="./src/viewer/main.ts"></script>
  </body>
</html>

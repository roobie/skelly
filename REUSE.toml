SPDX-License-Identifier = "EUPL-1.2"
SPDX-FileCopyrightText = "Björn Roberg"

# Third-party files, as received. Each declares its source's own licence and authors.

# Rapier's TypeScript bindings and LICENSE, from dimforge/rapier.js at the revision in
# provenance.json, built by packages/deadvox/tools/rapier-f64.
[[annotations]]
path = "packages/deadvox/vendor/rapier-f64/**"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2020 Sébastien Crozet"

# The WebAssembly module statically links the Rust crates pinned in
# packages/deadvox/tools/rapier-f64/Cargo.lock; besides Apache-2.0, some of them are MIT or Zlib only.
[[annotations]]
path = "packages/deadvox/vendor/rapier-f64/rapier_wasm3d_bg.wasm"
SPDX-License-Identifier = "Apache-2.0 AND MIT AND Zlib"
SPDX-FileCopyrightText = ["2020 Sébastien Crozet", "The authors of the crates pinned in packages/deadvox/tools/rapier-f64/Cargo.lock"]

# Written by our build script, not received from Rapier.
[[annotations]]
path = [
  "packages/deadvox/vendor/rapier-f64/package.json",
  "packages/deadvox/vendor/rapier-f64/provenance.json",
]
precedence = "override"
SPDX-License-Identifier = "EUPL-1.2"
SPDX-FileCopyrightText = "Björn Roberg"


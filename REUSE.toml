# Licensing by path. The rule and its reasons are in `docs/licensing.md`.
# When several annotations match a file, the last one wins, so this file runs from the
# default, through content and the code inside content folders, to third-party files.
# Our own annotations override what a file seems to say about itself, since a stray "©" in
# code would otherwise read as a copyright notice; a third-party file's own notice wins.
version = 1

# Code, docs, tests and build config.
[[annotations]]
path = "**"
precedence = "override"
SPDX-License-Identifier = "EUPL-1.2"
SPDX-FileCopyrightText = "Björn Roberg"

# Content: models, their authoring sources, game data, maps and our own media.
[[annotations]]
path = [
  "assets/**",
  "site/assets/**",
  "things/catalogue-drafts/**",
  "packages/deadvox/src/content/**",
  "packages/deadvox/src/config/bundled/**",
  "packages/deadvox/maps/**.tmj",
  "packages/deadvox/public/favicon.svg",
  "packages/deadvox/playtests/*/assets/**",
  "packages/gun-authoring-tool/cartridges/**",
  "packages/gun-authoring-tool/designs/**",
  "packages/gun-authoring-tool/exports/**",
  "packages/gun-authoring-tool/references/**",
  "packages/gun-authoring-tool/src/gun/*.json",
  "packages/gun-authoring-tool/src/gun/*.jsonnet",
  "packages/gun-authoring-tool/fixtures/archetype-*.json",
  "packages/gun-authoring-tool/fixtures/ak-standard-handguard.json",
  "packages/thing-authoring-tool/*.libsonnet",
  "packages/thing-authoring-tool/items.json",
  "packages/thing-authoring-tool/items.jsonnet",
  "packages/thing-authoring-tool/catalogue/**",
  "packages/thing-authoring-tool/experiments/**",
  "packages/thing-authoring-tool/exports/**",
  "packages/thing-authoring-tool/vehicles/**",
  "packages/thing-core/src/materials.json",
  "packages/thing-core/src/materials.jsonnet",
  "packages/mobgen/src/mob/*.json",
  "packages/mobgen/src/mob/*.jsonnet",
]
precedence = "override"
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"
SPDX-FileCopyrightText = "Björn Roberg"


name: mobgen

# Markdown-only changes skip this workflow (no mobgen check reads Markdown).
on:
  push:
    branches: [main, framework/refactor]
    paths: ['packages/mobgen/**', 'packages/mods/skelly.body/**', 'package.json', 'package-lock.json', '!**/*.md', 'testPool.ts', '.github/workflows/mobgen.yml']
  pull_request:
    paths: ['packages/mobgen/**', 'packages/mods/skelly.body/**', 'package.json', 'package-lock.json', '!**/*.md', 'testPool.ts', '.github/workflows/mobgen.yml']

# PR updates replace this PR's checks; main/manual groups always remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobgen
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache submodule go-jsonnet
        uses: actions/cache@v4
        with:
          path: packages/skelly-assets/tools/jsonnet/bin
          key: jsonnet-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/skelly-assets/tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../..
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

name: mobgen

# Markdown-only changes skip this workflow (no mobgen check reads Markdown).
on:
  push:
    branches: [main]
    paths: ['mobgen/**', '!**/*.md', 'testPool.ts', '.github/workflows/mobgen.yml']
  pull_request:
    paths: ['mobgen/**', '!**/*.md', 'testPool.ts', '.github/workflows/mobgen.yml']

# PR updates replace this PR's checks; main/manual groups always remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobgen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobgen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

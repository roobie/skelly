name: slow-tests

# Whole-world, scenario-walk and long-sweep tests run only on demand; `AGENTS.md`, "Tests" says why.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadvox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/deadvox
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - name: Cache submodule go-jsonnet
        uses: actions/cache@v4
        with:
          path: packages/skelly-assets/tools/jsonnet/bin
          key: jsonnet-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/skelly-assets/tools/jsonnet/runtime.json') }}
      - name: Cache pinned skelly-assets release
        uses: actions/cache@v4
        with:
          path: |
            packages/skelly-assets/built
            tools/skelly-assets/installed.json
          key: skelly-assets-${{ runner.os }}-${{ hashFiles('tools/skelly-assets/release.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - name: Install pinned go-jsonnet
        run: npm --prefix ../.. run jsonnet:setup
      - name: Install pinned skelly-assets release
        run: npm --prefix ../.. run assets:setup
      - run: npm run test:sweeps

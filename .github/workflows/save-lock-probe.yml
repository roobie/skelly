name: save-lock probe

# Repeats the two stages behind the unreproduced save-lock flakes on the CI image and keeps their
# timeout diagnostics. GitHub dispatches a workflow only once its file is on the default branch, so
# the push trigger, limited to the probe's own branch, is what starts it before merge. See docs/browser-ci.md.
on:
  push:
    branches: [deadvox/weathering-firefox-flake]
  workflow_dispatch:
    inputs:
      repeats:
        description: Sequential repetitions of the stage inside each job
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user pwuser
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [weathering-go, win-checkpoint]
        replica: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: packages/deadvox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Trust the checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/deadvox/tools/lit-check/package-lock.json
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - name: Install pinned go-jsonnet
        run: npm --prefix ../.. run jsonnet:setup
      - name: Install Playwright browsers
        timeout-minutes: 3
        run: npx playwright install firefox chromium
      # Every repetition runs to its end so one failure does not hide how often it recurs.
      - name: Repeat the stage
        timeout-minutes: 24
        env:
          REPEATS: ${{ inputs.repeats || '3' }}
          STAGE: ${{ matrix.stage }}
          DEADVOX_FIREFOX_UI_WEATHERING_TEST: '1'
        run: |
          mkdir -p test-results/save-lock-probe
          failures=0
          for n in $(seq 1 "$REPEATS"); do
            log="test-results/save-lock-probe/$STAGE-$n.log"
            if [ "$STAGE" = weathering-go ]; then
              timeout 420 xvfb-run -a node test/browser/firefox-ui.mjs > "$log" 2>&1 || failures=$((failures + 1))
            else
              timeout 420 node test/browser/save-controller-regressions.mjs > "$log" 2>&1 || failures=$((failures + 1))
            fi
          done
          echo "$STAGE: $failures of $REPEATS repetitions failed" | tee test-results/save-lock-probe/summary-$STAGE.txt
          [ "$failures" -eq 0 ]
      - name: Upload probe diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: save-lock-probe-${{ matrix.stage }}-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/deadvox/test-results/
          if-no-files-found: ignore

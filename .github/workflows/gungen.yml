name: gungen

# Markdown-only changes skip this workflow, except PROJECT.md, whose code citations
# test/projectDoc.test.ts checks. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths: ['gungen/**', '!**/*.md', 'gungen/PROJECT.md', 'deadvox/package-lock.json', 'testPool.ts', '.github/workflows/gungen.yml']
  pull_request:
    paths: ['gungen/**', '!**/*.md', 'gungen/PROJECT.md', 'deadvox/package-lock.json', 'testPool.ts', '.github/workflows/gungen.yml']

# PR updates replace this PR's checks; main/manual groups always remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gungen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gungen/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../deadvox
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('deadvox/package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 3
        run: npx playwright install chromium
        working-directory: deadvox
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run check:designs
      - run: npx vite build
      - name: Viewer browser tests (managed Chromium)
        timeout-minutes: 2
        run: npm run test:browser

name: gungen

# Markdown-only changes skip this workflow, except PROJECT.md, whose code citations
# test/projectDoc.test.ts checks. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - 'packages/gun-authoring-tool/**'
      - 'packages/thing-core/**'
      - 'packages/thing-export/**'
      - 'packages/engine/**'
      - 'packages/tool-ui/**'
      - 'packages/deadvox/src/**'
      - 'package-lock.json'
      - 'packages/mobgen/src/**'
      - '!**/*.md'
      - 'packages/gun-authoring-tool/PROJECT.md'
      - 'testPool.ts'
      - '.github/workflows/gungen.yml'
  pull_request:
    paths:
      - 'packages/gun-authoring-tool/**'
      - 'packages/thing-core/**'
      - 'packages/thing-export/**'
      - 'packages/engine/**'
      - 'packages/tool-ui/**'
      - 'packages/deadvox/src/**'
      - 'package-lock.json'
      - 'packages/mobgen/src/**'
      - '!**/*.md'
      - 'packages/gun-authoring-tool/PROJECT.md'
      - 'testPool.ts'
      - '.github/workflows/gungen.yml'

# PR updates replace this PR's checks; main/manual groups always remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gun-authoring-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../..
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        timeout-minutes: 3
        run: npx playwright install chromium
        working-directory: packages/deadvox
      - run: npm --prefix ../engine run typecheck
      - run: npm --prefix ../tool-ui run typecheck
      - run: npm --prefix ../tool-ui test
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run check:designs
      - run: npx vite build
      - name: Viewer browser tests (managed Chromium)
        timeout-minutes: 2
        run: npm run test:browser

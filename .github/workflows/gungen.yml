name: gungen

# Markdown-only changes skip this workflow, except PROJECT.md, whose code citations
# test/projectDoc.test.ts checks. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths: ['gungen/**', '!**/*.md', 'gungen/PROJECT.md', 'testPool.ts', '.github/workflows/gungen.yml']
  pull_request:
    paths: ['gungen/**', '!**/*.md', 'gungen/PROJECT.md', 'testPool.ts', '.github/workflows/gungen.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gungen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gungen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run check:designs
      # Khronos glTF-Validator over the export of every design (also part of `npm test`).
      - run: npx vitest run test/glbValidate.test.ts
      - run: npx vite build

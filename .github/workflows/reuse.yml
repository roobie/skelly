name: reuse

# Why this gate exists: `README.md`, "Licence".
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m venv "$RUNNER_TEMP/reuse"
      - run: '"$RUNNER_TEMP/reuse/bin/pip" install --require-hashes --no-deps -r tools/reuse/requirements.txt'
      - run: '"$RUNNER_TEMP/reuse/bin/reuse" lint'

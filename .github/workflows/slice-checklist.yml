name: Tick slice checklist

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  tick:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: actions/github-script@v7
        with:
          script: |
            const { milestonesFromPrBody, tickMilestone } = await import(`${process.env.GITHUB_WORKSPACE}/tools/slice-checklist.mjs`);
            const pullRequest = context.payload.pull_request;
            const milestones = milestonesFromPrBody(pullRequest.body ?? '');
            if (milestones.length === 0) {
              core.info('No Slice-Milestone declaration; checklist is unchanged.');
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              labels: ['slice-checklist'],
              per_page: 100,
            });
            const checklists = issues.filter((issue) => !issue.pull_request);
            if (checklists.length !== 1) {
              throw new Error(`Expected exactly one open issue labelled slice-checklist; found ${checklists.length}.`);
            }

            const checklist = checklists[0];
            let body = checklist.body ?? '';
            for (const id of milestones) {
              body = tickMilestone(body, id, pullRequest.number);
            }
            await github.rest.issues.update({
              ...context.repo,
              issue_number: checklist.number,
              body,
            });
            core.info(`Updated checklist issue #${checklist.number} for merged PR #${pullRequest.number}.`);

name: pages

# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    # Retain project runtime/build inputs; tests and Markdown do not change the site.
    paths:
      - 'site/**'
      - 'gungen/**'
      - 'packages/engine/**'
      - 'packages/tool-ui/**'
      - 'packages/thing-core/**'
      - 'packages/thing-export/**'
      - 'packages/thing-authoring-tool/**'
      - 'packages/deadvox/**'
      - 'packages/mobgen/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.jsonc'
      - 'testPool.ts'
      - '.npmrc'
      - '.node-version'
      - '.github/workflows/pages.yml'
      - '!**/*.md'
      - '!gungen/test/**'
      - '!packages/deadvox/test/**'
      - '!packages/mobgen/test/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/deadvox/tools/lit-check/package-lock.json
      - name: Lint (repo-wide)
        run: |
          npm ci
          npm ci --prefix packages/deadvox/tools/lit-check
          npm run jsonnet:setup
          npm run ci
          npm run test:site
      - name: Check and build gungen
        working-directory: gungen
        run: |
          npm run typecheck
          npm test
          PAGES_ANALYTICS=1 npx vite build
      - name: Check and build thing-authoring-tool
        working-directory: packages/thing-authoring-tool
        run: |
          npm run typecheck
          npm test
          npx vite build
      - name: Check and build deadvox
        working-directory: packages/deadvox
        run: |
          npm run typecheck
          npm test
          npm run validate
          PAGES_ANALYTICS=1 npx vite build
      - name: Check and build mobgen
        working-directory: packages/mobgen
        run: |
          npm run typecheck
          npm test
          PAGES_ANALYTICS=1 npx vite build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for P in gungen packages/deadvox packages/mobgen packages/thing-authoring-tool; do
            mkdir -p _site/${P#packages/}
            cp -r $P/dist/. _site/${P#packages/}/
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

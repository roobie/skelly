name: pages

# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    # Retain project runtime/build inputs; tests and Markdown do not change the site.
    paths:
      - 'site/**'
      - 'packages/skelly-assets'
      - 'tools/skelly-assets/**'
      - '.gitmodules'
      - 'packages/deadvox/**'
      - 'packages/engine/**'
      - 'packages/presentation/**'
      - 'packages/mods/**'
      - 'tools/lit-check/**'
      - 'tools/pages-analytics/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.jsonc'
      - 'testPool.ts'
      - '.npmrc'
      - '.node-version'
      - '.github/workflows/pages.yml'
      - '!**/*.md'
      - '!packages/deadvox/test/**'
      - '!packages/engine/test/**'
      - '!packages/presentation/test/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - name: Cache submodule go-jsonnet
        uses: actions/cache@v4
        with:
          path: packages/skelly-assets/tools/jsonnet/bin
          key: jsonnet-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/skelly-assets/tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lit-check/package-lock.json
      - name: Lint (repo-wide)
        run: |
          npm ci
          npm ci --prefix tools/lit-check
          npm run jsonnet:setup
          npm run assets:setup
          npm run ci
          npm run test:site
      - name: Check and build deadvox
        working-directory: packages/deadvox
        run: |
          npm run typecheck
          npm run validate
          PAGES_ANALYTICS=1 npx vite build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          find _site -name '*.html' -exec node tools/pages-analytics/cli.mjs {} +
          mkdir -p _site/deadvox
          cp -r packages/deadvox/dist/. _site/deadvox/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

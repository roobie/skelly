name: pages

# Publishes the site to GitHub Pages on runtime/build-input changes to main:
#   /          site/index.html (landing page)
#   /gungen/   the gungen viewer
#   /deadvox/  the deadvox game
#   /mobgen/   the mobgen viewer
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    # Retain project runtime/build inputs; tests and Markdown do not change the site.
    paths:
      - 'site/**'
      - 'gungen/**'
      - 'deadvox/**'
      - 'mobgen/**'
      - 'package.json'
      - 'package-lock.json'
      - 'biome.jsonc'
      - 'testPool.ts'
      - '.npmrc'
      - '.node-version'
      - '.github/workflows/pages.yml'
      - '!**/*.md'
      - '!gungen/test/**'
      - '!deadvox/test/**'
      - '!mobgen/test/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gungen/package-lock.json
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
            mobgen/package-lock.json
      - name: Lint (repo-wide)
        run: |
          npm ci
          npm ci --prefix gungen
          npm ci --prefix deadvox
          npm ci --prefix deadvox/tools/lit-check
          npm ci --prefix mobgen
          npm run ci
          npm run test:site
      - name: Check and build gungen
        working-directory: gungen
        run: |
          npm run typecheck
          npm test
          PAGES_ANALYTICS=1 npx vite build
      - name: Check and build deadvox
        working-directory: deadvox
        run: |
          npm run typecheck
          npm test
          npm run validate
          PAGES_ANALYTICS=1 npx vite build
      - name: Check and build mobgen
        working-directory: mobgen
        run: |
          npm run typecheck
          npm test
          PAGES_ANALYTICS=1 npx vite build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r gungen/dist _site/gungen
          cp -r deadvox/dist _site/deadvox
          cp -r mobgen/dist _site/mobgen
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

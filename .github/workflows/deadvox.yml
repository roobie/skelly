name: deadvox

# Markdown-only changes skip this workflow, except TROUBLESHOOTING.md, whose generated key
# table test/debugActions.test.ts checks against the code. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  pull_request:
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lit-check
      - run: npm run lint:lit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui-browser
      - name: Install headed Firefox and system dependencies
        run: npx playwright install --with-deps firefox
      - name: Firefox browser contract
        run: xvfb-run -a npm run test:browser:firefox
      - run: npm run validate
      - run: npx vite build
      - run: node tools/check-favicon.mjs

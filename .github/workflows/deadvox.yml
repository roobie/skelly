name: deadvox

on:
  push:
    branches: [main]
    paths: ['deadvox/**', '.github/workflows/deadvox.yml']
  pull_request:
    paths: ['deadvox/**', '.github/workflows/deadvox.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deadvox/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npx vite build

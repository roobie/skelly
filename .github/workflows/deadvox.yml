name: deadvox

# TROUBLESHOOTING's generated key table remains a checked build input.
on:
  push:
    branches: [main]
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  pull_request:
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        default: sharded
        options: [sharded, serial, pilot]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci --prefix ..
      - name: Browser partition manifest
        run: node ../test/browser-ci-manifest.mjs
      - run: npm ci
      - run: npm ci --prefix tools/lit-check
      - run: timeout 300 npm run lint:lit
      - run: timeout 300 npm run typecheck
      - name: Full test suite (includes the save budget fixture once)
        run: timeout 300 npm test -- --maxWorkers=2
      - run: timeout 300 npm run validate
      - run: timeout 300 npx vite build
      - run: timeout 300 node tools/check-favicon.mjs
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-fast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deadvox/test-results/
          if-no-files-found: ignore

  browser:
    needs: fast
    if: ${{ github.event.inputs.layout != 'serial' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [input, save-other, opfs, indexeddb, firefox]
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: ${{ matrix.shard }}

  # Both layouts in one manual run have the same checkout SHA and reusable case definitions.
  serial:
    needs: fast
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.layout == 'serial' || github.event.inputs.layout == 'pilot') }}
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: all

  check:
    needs: [fast, browser, serial]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          LAYOUT: ${{ github.event.inputs.layout || 'sharded' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { checkBrowserWorkflow } = await import(`${process.env.GITHUB_WORKSPACE}/tools/browser-ci-result.mjs`);
            await checkBrowserWorkflow({
              env: process.env,
              lookupAttempt: async (attempt) => {
                const { data } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: context.runId, attempt_number: attempt
                });
                return { conclusion: data.conclusion, url: data.html_url };
              }
            });

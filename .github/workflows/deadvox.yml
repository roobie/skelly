name: deadvox

on:
  push:
    branches: [main, 'deadvox/saves-*']
    paths: ['deadvox/**', 'mobgen/src/**', '.github/workflows/deadvox.yml']
  pull_request:
    paths: ['deadvox/**', 'mobgen/src/**', '.github/workflows/deadvox.yml']
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lit-check
      - run: npm run lint:lit
      - run: npm run typecheck
      - name: Save round-trip and budget benchmark
        run: timeout 300 npm test -- test/snapshot.test.ts -t 'checks a representative ten-hour hamlet save and records its size and timings' --silent=false
      - run: timeout 300 npm test
      - run: timeout 300 npm run test:ui-browser
      - name: Install headed Firefox and system dependencies
        run: npx playwright install --with-deps firefox
      - name: Firefox browser contract
        run: xvfb-run -a timeout 300 npm run test:browser:firefox
      - run: npm run validate
      - run: npx vite build
      - run: node tools/check-favicon.mjs

name: deadvox

# Keep troubleshooting changes checked with browser contracts because it documents their stage modes.
on:
  push:
    branches: [main]
    paths:
      - 'packages/deadvox/**'
      - 'packages/engine/**'
      - 'packages/tool-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/jsonnet/**'
      - 'packages/mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'packages/deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  pull_request:
    paths:
      - 'packages/deadvox/**'
      - 'packages/engine/**'
      - 'packages/tool-ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tools/jsonnet/**'
      - 'packages/mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'packages/deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        default: sharded
        options: [sharded, control]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  fast:
    if: ${{ github.event.inputs.layout != 'control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: packages/deadvox
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/deadvox/tools/lit-check/package-lock.json
      # A warm-cache install takes seconds, so the 3-minute limit stays. The restored cache holds
      # every tarball; audit and revalidation are the only registry calls left, and a silent
      # stall in one of them is what timed the step out (#1108).
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - name: Install pinned go-jsonnet
        run: npm --prefix ../.. run jsonnet:setup
      - name: Browser partition manifest
        timeout-minutes: 1
        run: node ../../test/browser-ci-manifest.mjs
      - run: npm ci --prefix tools/lit-check --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - run: timeout 300 npm run lint:lit
      - run: timeout 300 npm run lint:time
      - run: timeout 300 npm run typecheck
      - name: Gauntlet route sweep (stands in for a runtime route proof)
        run: timeout 300 npm run test:sweeps
      - run: timeout 300 npm run validate
      - run: timeout 300 npx vite build
      - run: timeout 300 node tools/check-favicon.mjs
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-fast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/deadvox/test-results/
          if-no-files-found: ignore

  # One shard per test file group, so the save budget fixture's file runs in exactly one shard.
  # The step bound is about twice a shard's expected work, so a hang or a runaway shard fails fast (#1140).
  unit:
    if: ${{ github.event.inputs.layout != 'control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    defaults:
      run:
        working-directory: packages/deadvox
    steps:
      - uses: actions/checkout@v4
      - name: Cache go-jsonnet
        uses: actions/cache@v4
        with:
          path: tools/jsonnet/bin
          key: jsonnet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/jsonnet/runtime.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefix ../.. --no-audit --no-fund --prefer-offline
        timeout-minutes: 3
      - name: Install pinned go-jsonnet
        run: npm --prefix ../.. run jsonnet:setup
      - name: Unit suite shard ${{ matrix.shard }}
        run: timeout 150 npm test -- --maxWorkers=2 --shard=${{ matrix.shard }}
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-unit-${{ strategy.job-index }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/deadvox/test-results/
          if-no-files-found: ignore

  browser:
    needs: fast
    if: ${{ github.event.inputs.layout != 'control' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [input, stages, save-other, opfs, indexeddb, firefox]
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: ${{ matrix.shard }}

  # These start independently, reproducing the check/browser-stages jobs #255 replaced (main badb55e), with their step order.
  control-check:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.layout == 'control' }}
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: control-check

  control-stages:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.layout == 'control' }}
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: control-stages

  check:
    needs: [fast, unit, browser, control-check, control-stages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          LAYOUT: ${{ github.event.inputs.layout || 'sharded' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { checkBrowserWorkflow } = await import(`${process.env.GITHUB_WORKSPACE}/tools/browser-ci-result.mjs`);
            await checkBrowserWorkflow({
              env: process.env,
              lookupAttempt: async (attempt) => {
                const { data } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: context.runId, attempt_number: attempt
                });
                return { conclusion: data.conclusion, url: data.html_url };
              }
            });
      - name: Report earlier same-SHA runs
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { reportEarlierRuns } = await import(`${process.env.GITHUB_WORKSPACE}/tools/browser-ci-result.mjs`);
            const headSha = context.payload.pull_request?.head?.sha ?? context.sha;
            await reportEarlierRuns({
              currentRunId: context.runId,
              listRuns: async () => {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: 'deadvox.yml', head_sha: headSha, per_page: 100
                });
                return runs.map(({ id, status, run_attempt }) => ({ id, status, attemptCount: run_attempt }));
              },
              lookupAttempt: async (runId, attempt) => {
                const { data } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: runId, attempt_number: attempt
                });
                return { conclusion: data.conclusion ?? 'unknown', url: data.html_url };
              },
              warn: (message) => core.warning(message),
              writeNote: (message) => core.summary
                .addHeading('Earlier runs at this head SHA')
                .addRaw(message, true)
                .write(),
            });

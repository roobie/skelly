name: deadvox

# Markdown-only changes skip this workflow, except TROUBLESHOOTING.md, whose generated key
# table test/debugActions.test.ts checks against the code. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  pull_request:
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lit-check
      - run: timeout 300 npm run lint:lit
      - run: timeout 300 npm run typecheck
      - name: Full test suite (includes the save budget fixture once)
        run: timeout 300 npm test -- --maxWorkers=2
      - run: timeout 300 npm run test:ui-browser
      - name: Install headed Firefox and system dependencies
        run: npx playwright install --with-deps firefox
      - name: Firefox browser contract
        run: xvfb-run -a timeout 300 npm run test:browser:firefox
      - run: timeout 300 npm run validate
      - run: timeout 300 npx vite build
      - run: timeout 300 node tools/check-favicon.mjs

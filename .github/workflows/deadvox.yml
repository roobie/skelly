name: deadvox

# Markdown-only changes skip this workflow, except TROUBLESHOOTING.md, whose generated key
# table test/debugActions.test.ts checks against the code. Later patterns override earlier ones.
on:
  push:
    branches: [main]
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  pull_request:
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox.yml'
  workflow_dispatch: {}

# PR updates replace this PR's checks; main/manual groups always remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tools/lit-check
      - run: timeout 300 npm run lint:lit
      - run: timeout 300 npm run typecheck
      - name: Full test suite (includes the save budget fixture once)
        run: timeout 300 npm test -- --maxWorkers=2
      - name: Browser UI contract (Chromium)
        timeout-minutes: 9
        run: node tools/ui-browser-contract.mjs
      - name: Melee build-click browser contract
        timeout-minutes: 1
        run: node test/browser/melee-build-click.mjs
      - name: Primary-action browser contract
        timeout-minutes: 2
        run: node test/browser/primary-action.mjs
      - name: Save-controller browser regressions
        timeout-minutes: 4
        run: node test/browser/save-controller-regressions.mjs
      - name: Save-storage browser contract (Chromium)
        timeout-minutes: 1
        run: node test/browser/save-storage.mjs chromium
      - name: Save autosave — OPFS Continue (Chromium)
        timeout-minutes: 4
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: opfs
          SAVE_AUTOSAVE_SCENARIO: continue
        run: node test/browser/save-storage.mjs chromium
      - name: Save autosave — OPFS replacement (Chromium)
        timeout-minutes: 8
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: opfs
          SAVE_AUTOSAVE_SCENARIO: replacement
        run: node test/browser/save-storage.mjs chromium
      - name: Save autosave — IndexedDB Continue (Chromium)
        timeout-minutes: 4
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: indexeddb
          SAVE_AUTOSAVE_SCENARIO: continue
        run: node test/browser/save-storage.mjs chromium
      - name: Save autosave — IndexedDB replacement (Chromium)
        timeout-minutes: 8
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: indexeddb
          SAVE_AUTOSAVE_SCENARIO: replacement
        run: node test/browser/save-storage.mjs chromium
      - name: Save busy-lock relaunch (Chromium; independent of Continue)
        timeout-minutes: 2
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: indexeddb
          SAVE_AUTOSAVE_SCENARIO: busy-lock
        run: node test/browser/save-storage.mjs chromium
      - name: Insecure-context browser contract
        timeout-minutes: 1
        run: node test/browser/insecure-saves.mjs
      - name: Install headed Firefox and system dependencies
        run: npx playwright install --with-deps firefox
      # Quarantined (BR's no-flaky rule): Firefox refuses the pointer lock with NotSupportedError
      # under a real user activation, intermittently. Root cause, coverage lost and the proof
      # needed to reinstate this step: https://github.com/roobie/skelly/issues/168
      # Local investigation: `npm run test:browser:firefox:native`. To reinstate, restore this step:
      #   - name: Firefox first-click browser contract
      #     timeout-minutes: 2
      #     run: xvfb-run -a node test/browser/firefox-first-click.mjs
      - name: Firefox UI contract (synthetic pointer lock; native case remains quarantined)
        timeout-minutes: 2
        run: xvfb-run -a node test/browser/firefox-ui.mjs
      - name: Firefox save-storage browser contract
        timeout-minutes: 2
        run: xvfb-run -a node test/browser/save-storage.mjs firefox
      - name: Firefox inventory-scroll browser contract
        timeout-minutes: 1
        run: xvfb-run -a node test/browser/inventory-scroll.mjs firefox
      # Quarantined (BR's no-flaky rule): after Continue, the wait for a visible #view canvas
      # intermittently times out; cause unknown. The d20 busy-lock regression is independent below.
      # Coverage lost and the proof needed to reinstate this step:
      # https://github.com/roobie/skelly/issues/170
      # Local investigation: `npm run test:browser:firefox:continue`. To reinstate, restore this step:
      #   - name: Firefox autosave — IndexedDB Continue
      #     timeout-minutes: 1
      #     env:
      #       SAVE_AUTOSAVE_ONLY: '1'
      #       SAVE_AUTOSAVE_BACKEND: indexeddb
      #       SAVE_AUTOSAVE_SCENARIO: continue
      #     run: xvfb-run -a node test/browser/save-storage.mjs firefox
      - name: Firefox busy-lock relaunch (independent of quarantined Continue)
        timeout-minutes: 2
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: indexeddb
          SAVE_AUTOSAVE_SCENARIO: busy-lock
        run: xvfb-run -a node test/browser/save-storage.mjs firefox
      - name: Firefox autosave — IndexedDB replacement
        timeout-minutes: 1
        env:
          SAVE_AUTOSAVE_ONLY: '1'
          SAVE_AUTOSAVE_BACKEND: indexeddb
          SAVE_AUTOSAVE_SCENARIO: replacement
        run: xvfb-run -a node test/browser/save-storage.mjs firefox
      - run: timeout 300 npm run validate
      - run: timeout 300 npx vite build
      - run: timeout 300 node tools/check-favicon.mjs
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-check-test-results
          path: deadvox/test-results/
          if-no-files-found: ignore

  # The Chromium stages of `npm run test:ui-browser` that `check` does not run, in parallel with it so the
  # PR's time-to-green stays at `check`'s. test/deadvox-browser-ci.test.mjs (root `npm run ci`) fails when a
  # stage of a browser script has no step in this file. Chromium is the runner image's Chrome, which the
  # scripts find through the image's CHROME_BIN, exactly as in `check`; each script starts its own Vite server.
  browser-stages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Same lockfiles as `check`, so both jobs share one npm cache entry.
          cache-dependency-path: |
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci
      - name: Inventory scroll browser contract (Chromium)
        timeout-minutes: 1
        run: node test/browser/inventory-scroll.mjs chromium
      - name: Full-auto fire browser contract
        timeout-minutes: 1
        run: node test/browser/full-auto.mjs
      - name: Case visual pool browser contract
        timeout-minutes: 1
        run: node test/browser/case-visual-pool.mjs
      - name: Pump handling browser contract (Chromium)
        timeout-minutes: 5
        run: timeout 300 node test/browser/pump-handling.mjs
      - name: Stairs traversal browser contract
        timeout-minutes: 3
        run: node test/browser/stairs.mjs traversal
      - name: Stairs lighting browser contract
        timeout-minutes: 5
        run: node test/browser/stairs.mjs lighting
      - name: Reading consumer browser contract
        timeout-minutes: 3
        run: node test/browser/reading.mjs consumer
      - name: Reading lifecycle browser contract
        timeout-minutes: 3
        run: node test/browser/reading.mjs lifecycle
      - name: Upload browser-stage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-browser-stages-test-results
          path: deadvox/test-results/
          if-no-files-found: ignore

name: deadvox

# Keep troubleshooting changes checked with browser contracts because it documents their stage modes.
on:
  push:
    branches: [main]
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  pull_request:
    paths:
      - 'deadvox/**'
      - 'mobgen/src/**'
      - 'testPool.ts'
      - '!**/*.md'
      - 'deadvox/TROUBLESHOOTING.md'
      - '.github/workflows/deadvox*.yml'
      - 'tools/browser-ci*.mjs'
      - 'test/browser-ci*.mjs'
  workflow_dispatch:
    inputs:
      layout:
        type: choice
        default: sharded
        options: [sharded, control]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  fast:
    if: ${{ github.event.inputs.layout != 'control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: deadvox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deadvox/package-lock.json
            deadvox/tools/lit-check/package-lock.json
      - run: npm ci --prefix ..
        timeout-minutes: 3
      - name: Browser partition manifest
        timeout-minutes: 1
        run: node ../test/browser-ci-manifest.mjs
      - run: npm ci
        timeout-minutes: 3
      - run: npm ci --prefix tools/lit-check
        timeout-minutes: 3
      - run: timeout 300 npm run lint:lit
      - run: timeout 300 npm run lint:time
      - run: timeout 300 npm run typecheck
      - name: Full test suite (includes the save budget fixture once)
        run: timeout 300 npm test -- --maxWorkers=2
      - run: timeout 300 npm run validate
      - run: timeout 300 npx vite build
      - run: timeout 300 node tools/check-favicon.mjs
      - name: Upload check artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadvox-fast-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deadvox/test-results/
          if-no-files-found: ignore

  browser:
    needs: fast
    if: ${{ github.event.inputs.layout != 'control' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [input, stages, save-other, opfs, indexeddb, firefox]
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: ${{ matrix.shard }}

  # These start independently, reproducing the check/browser-stages jobs #255 replaced (main badb55e), with their step order.
  control-check:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.layout == 'control' }}
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: control-check

  control-stages:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.layout == 'control' }}
    uses: ./.github/workflows/deadvox-browser.yml
    with:
      shard: control-stages

  check:
    needs: [fast, browser, control-check, control-stages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          LAYOUT: ${{ github.event.inputs.layout || 'sharded' }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const { checkBrowserWorkflow } = await import(`${process.env.GITHUB_WORKSPACE}/tools/browser-ci-result.mjs`);
            await checkBrowserWorkflow({
              env: process.env,
              lookupAttempt: async (attempt) => {
                const { data } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: context.runId, attempt_number: attempt
                });
                return { conclusion: data.conclusion, url: data.html_url };
              }
            });
      - name: Report earlier same-SHA runs
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { reportEarlierRuns } = await import(`${process.env.GITHUB_WORKSPACE}/tools/browser-ci-result.mjs`);
            const headSha = context.payload.pull_request?.head?.sha ?? context.sha;
            await reportEarlierRuns({
              currentRunId: context.runId,
              listRuns: async () => {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo, workflow_id: 'deadvox.yml', head_sha: headSha, per_page: 100
                });
                return runs.map(({ id, status, run_attempt }) => ({ id, status, attemptCount: run_attempt }));
              },
              lookupAttempt: async (runId, attempt) => {
                const { data } = await github.rest.actions.getWorkflowRunAttempt({
                  ...context.repo, run_id: runId, attempt_number: attempt
                });
                return { conclusion: data.conclusion ?? 'unknown', url: data.html_url };
              },
              warn: (message) => core.warning(message),
              writeNote: (message) => core.summary
                .addHeading('Earlier runs at this head SHA')
                .addRaw(message, true)
                .write(),
            });

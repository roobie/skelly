name: lint

# Biome over the whole repo: formatting, lint and import order (see biome.jsonc).
# Subproject dependencies are installed so module-graph rules can resolve imports.

# Markdown-only changes skip it: Biome processes no Markdown, and the site test reads none.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

# Unique non-PR groups preserve pending main and manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:site

  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gungen/package-lock.json
            deadvox/package-lock.json
            mobgen/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gungen
      - run: npm ci --prefix deadvox
      - run: npm ci --prefix mobgen
      # The npm script runs the lockfile's @biomejs/biome and fails if it isn't installed;
      # `npx biome` could fall back to the unrelated `biome` package, which checks nothing.
      - run: npm run ci -- --reporter=github

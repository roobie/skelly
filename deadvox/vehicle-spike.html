<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadvox vehicle look — visual spike</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #a9bfd0; font-family: system-ui, sans-serif; }
      #stage { width: 100%; height: 100%; }
      canvas { display: block; }
      #note { position: fixed; top: 16px; left: 18px; max-width: 390px; padding: 12px 16px; color: #e9ecee; background: #111923d9; border: 1px solid #98a7b4; border-radius: 5px; line-height: 1.45; pointer-events: none; }
      #note h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
      #note p { margin: 4px 0 0; font-size: 13px; }
      #hint { position: fixed; right: 16px; bottom: 14px; color: #202a31; background: #f2f0e8dc; padding: 7px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; }
      #error { position: fixed; inset: auto 12px 52px; color: #a20d19; font-weight: 700; }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="Vehicle visual spike"></main>
    <aside id="note">
      <h1>Vehicle scale / style probe</h1>
      <p>Hand-built stand-ins in Deadvox's metre scale and daylight. A half-metre grid is the world-block reference; the voxel car uses Mobgen's voxel grain.</p>
      <p>Compare voxel and low-poly hatchbacks. The stripped car is up on a lift for Beat 4.</p>
    </aside>
    <div id="hint">Drag to orbit · wheel to zoom</div>
    <div id="error" role="status"></div>
    <script type="module" src="./src/debug/vehicleSpike.ts"></script>
  </body>
</html>

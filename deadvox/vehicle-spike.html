<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Deadvox vehicle parts — visual spike</title>
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20282d; background: #d8e0df; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; }
      header { height: 44px; display: flex; align-items: center; padding: 0 18px; color: #f2f0e8; background: #20282d; letter-spacing: .06em; font-size: 14px; font-weight: 700; }
      #workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(390px, 450px); height: calc(100% - 44px); }
      #stage { position: relative; min-width: 0; min-height: 0; background: #a9bfd0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #vehicle-label { position: absolute; top: 14px; left: 16px; padding: 9px 12px; color: #f2f0e8; background: #172128e8; border: 1px solid #abb6b5; border-radius: 4px; font-weight: 700; pointer-events: none; }
      #hint { position: absolute; right: 14px; bottom: 12px; max-width: 280px; padding: 7px 9px; color: #20282d; background: #f2f0e8e8; border-radius: 4px; font-size: 12px; pointer-events: none; }
      #controls { min-height: 0; overflow: auto; padding: 15px; background: #f1f0e9; border-left: 1px solid #9fa9a7; }
      h1 { margin: 0 0 5px; font-size: 17px; }
      h2 { margin: 17px 0 6px; color: #596356; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      p { margin: 5px 0; font-size: 12px; line-height: 1.4; }
      .quiet { color: #596356; }
      .row { display: flex; flex-wrap: wrap; gap: 5px; }
      button { border: 1px solid #8d9994; border-radius: 3px; padding: 6px 8px; color: #293238; background: #e5e6df; font: inherit; font-size: 12px; cursor: pointer; }
      button:hover { background: #d9ddd5; }
      button[aria-pressed="true"] { border-color: #996e31; color: #603f16; background: #f1dfb8; }
      #stats { padding: 7px 8px; background: #e3e5df; border-left: 3px solid #997744; font-size: 12px; line-height: 1.45; }
      #schematic { display: block; width: 100%; height: auto; border: 1px solid #9da49f; background: #171b20; touch-action: manipulation; cursor: crosshair; }
      #parts-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; max-height: 150px; overflow: auto; margin-top: 7px; }
      .part-toggle { overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; padding: 5px; }
      .toggle { display: inline-flex; align-items: center; gap: 5px; margin: 6px 10px 0 0; font-size: 12px; }
      #notice { min-height: 1em; color: #8a3b12; }
      #grain-note, #perf { color: #404d4c; font-size: 11px; }
      #error { position: fixed; z-index: 4; left: 12px; bottom: 54px; color: #a20d19; font-weight: 700; }
      @media (max-width: 950px) {
        body { overflow: auto; }
        #workspace { height: auto; min-height: calc(100% - 44px); grid-template-columns: 1fr; }
        #stage { height: min(70vh, 650px); min-height: 430px; }
        #controls { overflow: visible; border-left: 0; border-top: 1px solid #9fa9a7; }
      }
    </style>
  </head>
  <body>
    <header>DEADVOX · VEHICLE PARTS SPIKE</header>
    <main id="workspace">
      <section id="stage" aria-label="Assembled voxel vehicle">
        <canvas id="scene"></canvas>
        <div id="vehicle-label"></div>
        <div id="hint">Drag to orbit · wheel to zoom · arrow keys to pan · 1–7 for views</div>
      </section>
      <aside id="controls"></aside>
    </main>
    <script type="module" src="./src/debug/vehicleSpike.ts"></script>
  </body>
</html>

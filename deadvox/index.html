<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deadvox</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <main id="view"></main>
    <div id="damage" aria-hidden="true"></div>
    <div id="game-cursor-root"></div>
    <div id="crosshair"></div>
    <div id="hud"></div>
    <div id="inventory-stats" hidden></div>
    <div id="quickbar"></div>
    <div id="handling" hidden></div>
    <div id="prompt" hidden></div>
    <div id="rest" hidden></div>
    <section id="inventory" hidden></section>
    <div id="inventory-drag-root"></div>
    <div id="errors"></div>
    <div id="death" hidden></div>
    <div id="overlay">
      <div class="card">
        <div id="about">
          <h1>deadvox</h1>
          <p>Singleplayer voxel survival prototype.</p>
          <dl id="controls"></dl>
          <p class="go" id="go">Click to play</p>
          <div id="hud-options"></div>
          <div id="audio-options"></div>
          <p class="scale">
            View distance: <a href="?radius=64">64 m</a> ·
            <a href="?radius=96">96 m (default)</a> ·
            <a href="?radius=128">128 m</a>.
            Slower hardware: try 64 m. <a href="?bench=1">Run the benchmark</a> (about 3 minutes)
          </p>
          <p class="scale"><a href="#credits" id="show-credits">Credits</a> · <a href="./sounds.html" target="_blank" rel="noreferrer">Audio listening sheet</a> · <a href="https://github.com/roobie/skelly/issues/new?template=playtest-feedback.md" target="_blank" rel="noopener">Send feedback</a></p>
        </div>
        <div id="credits" hidden></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>

    <!-- 100% privacy-first analytics -->
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
